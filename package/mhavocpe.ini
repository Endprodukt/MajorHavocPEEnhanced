; Major Havoc PE Enhanced: the settings that come with the program.
; Your own go into save/mhavocpe.ini (same keys); what stands there wins.
; The service menu (F2 or Tab, or start 1 and jump held two seconds) writes
; them. The controls are laid out there too (save/controls.ini); the game's
; own settings (lives, difficulty, bonus, price, attract sounds) are kept in
; its EEPROM (save/eeprom.bin) and set on the menu's GAME, CREDIT and SOUND
; pages.

; A folder or zip with the ROMs. Empty: the package's own (roms/mhavocpe.zip,
; The Promised End 1.01, English, ADPCM speech), then --roms, $MH_ROMS,
; ./roms, the folders of advmame.rc (as mhavocpe.zip).
rom_path =

; Pictures between the game's pictures (1), the game's pictures steady,
; never slowed down in busy scenes (1; 0: as the cabinet)
smooth = 1
steady = 1

; The picture: 1.0 as large as the screen allows; position in board units
size_x = 1.000
size_y = 1.000
pos_x = 0
pos_y = 0
flip_x = 0
flip_y = 0
brightness = 1.00
gamma = 0.80
; pictures a second sent to the vector board, which shows each until the
; next comes (40..60, the service menu's BOARD RATE)
board_hz = 50

; The cabinet's option switches (hex), a bit 1 a switch off; only a new
; EEPROM takes them. 00 FF: 3 lives, medium, bonus at 100000, attract
; sounds, roller x1; 1 coin 1 play.
dsw1 = 00
dsw2 = FF

; The roller (all of it on the service menu's CONTROLS page, with a test).
; What turns it: dial (the cabinet's spinner; on a PC the mouse), dial2,
; trackball_x, trackball_y, mouse_x, mouse_y, joyN_axisM (a stick's axis,
; from 1), several joined by "+", or none.
roller = dial
; The sensitivity in MAME's percent: game counts for 100 of the spinner's.
; The cabinet's roller gave about 500 counts a turn (125 pulses, the LETA
; quadrature decoder counting each 4 times); a 1200 ppr spinner gives 1200:
; 42 makes a turn of the spinner a turn of the roller (faster: the game's
; ROLLER X2, or more here). Rex runs at full speed from about 2400 counts a
; second. spin_ppr: the spinner's counts a turn (for the menu's turns of the
; original).
spin_sens = 42
spin_ppr = 1200
spin_reverse = 0
; a stick's axis all the way, and rolling with keys or a stick's
; directions: counts a second (Rex runs at full speed from about 2400)
stick_speed = 2400
key_speed = 1600
menu_hold = 1

volume = 1.00
; the speech against the other sounds (1: as HBMAME mixes it)
speech = 1.00
; the music at its tempo however busy the sound CPU is (1; 0: as the
; cabinet, where it slows down at times)
steady_music = 1

; The enhancements (the service menu's GAME SETTINGS page), 1 on, 0 off:
; the marquee's PROMISED END: Enhanced under the title's MAJOR HAVOC; each
; screen that uses only part of the field (tactical display, story, high
; scores) zoomed to fill it (the tactical display x1.21, as large as it
; goes without cutting anything off); Breakout alone zoomed up while it is
; played (off: the whole tactical display stays in view).
fx_subtitle = 1
fx_fit = 1
fx_breakout = 0

; The build (the service menu's GAME SETTINGS; the game starts again with
; another): language 0 English, 1 German, 2 French; tournament 1 the
; Tournament Edition (other mazes; its high scores in save/eeprom_te.bin).
; All six come with the package (roms/).
language = 0
tournament = 0
